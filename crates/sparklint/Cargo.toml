[package]
name = "sparklint"
description = "A fast, Spark-aware linter for PySpark code and Databricks notebooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "sparklint"

[[bin]]
name = "sparklint"
path = "src/main.rs"

[dependencies]
sparklint_source = { path = "../sparklint_source" }
sparklint_semantic = { path = "../sparklint_semantic" }
ruff_text_size = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_python_parser = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
ignore = { workspace = true }
rustc-hash = { workspace = true }

[dependencies.sparklint_linter]
path = "../sparklint_linter"

[dev-dependencies]
tempfile = "3"
