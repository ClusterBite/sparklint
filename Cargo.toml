[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/clusterbite/sparklint"
homepage = "https://github.com/clusterbite/sparklint"
authors = ["Marthinus Bosman <hello@clusterbite.com>", "ClusterBite"]
rust-version = "1.97"

[workspace.dependencies]
# Astral publishes ruff's parser crates to crates.io; the API is unstable, so pin exactly.
ruff_python_parser = "=0.0.21"
ruff_python_ast = "=0.0.21"
ruff_text_size = "=0.0.21"
ruff_source_file = "=0.0.21"
ruff_notebook = "=0.0.21"
ruff_diagnostics = "=0.0.21"
ruff_python_trivia = "=0.0.21"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }  # exact floats in rewritten .ipynb outputs
toml = "0.8"
rayon = "1"
ignore = "0.4"
globset = "0.4"
rustc-hash = "2"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
