site_name: sparklint
site_description: A fast, Spark-aware linter for PySpark code and Databricks notebooks.
site_url: https://clusterbite.github.io/sparklint/
repo_url: https://github.com/clusterbite/sparklint
repo_name: clusterbite/sparklint
edit_uri: ""
copyright: Apache-2.0 · Built by <a href="https://clusterbite.com/?utm_source=docs&utm_medium=footer&utm_campaign=sparklint">ClusterBite</a>

# Sources are in docs/site; scripts/gen_docs.py writes rules/, cylint.md and changelog.md
# there first. Build: python3 scripts/gen_docs.py && mkdocs build --strict
docs_dir: docs/site
site_dir: target/docs-site
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Docs:
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - Suppressions: suppressions.md
      - Notebooks: notebooks.md
      - CI and editors: ci.md
      - How it works: how-it-works.md
      - Migrating from cylint: cylint.md
  - Rules: rules/index.md
  - Changelog: changelog.md

not_in_nav: |
  /rules/*.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
