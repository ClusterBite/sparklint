name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # Debug profile is enough to check packaging; release wheels come from release.yml.
          args: --out dist --locked
      - name: Install wheel
        shell: bash
        run: python -m pip install --no-index --find-links dist sparklint
      - name: Smoke test
        shell: bash
        run: |
          sparklint --version
          python -m sparklint --version
          sparklint rules > /dev/null
          # The fixtures are full of findings: exit code 1 is expected, 2 would be an error.
          set +e
          sparklint check tests/fixtures/ACT002 --statistics
          code=$?
          set -e
          test "$code" -eq 1
